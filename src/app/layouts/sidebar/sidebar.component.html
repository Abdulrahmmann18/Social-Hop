<!-- Sidebar -->
<aside class="fixed top-0 right-0 h-full w-72 bg-white shadow-lg z-50 transform transition-transform duration-300"
    [class.translate-x-0]="isSidebarOpen()" [class.translate-x-full]="!isSidebarOpen()">
    <!-- Sidebar Header -->
    <div class="flex items-center justify-between px-4 h-16 border-b">
        <h2 class="text-lg font-semibold">Settings</h2>
        <button (click)="toggleSidebar()" class="text-gray-500 hover:text-black cursor-pointer">
            ✕
        </button>
    </div>

    <!-- Sidebar Content -->
    <ul class="p-4 space-y-4">
        <li>
            <a class="block text-gray-700 hover:text-blue-600 cursor-pointer">
                Change Password
            </a>
        </li>
        <li>
            <a class="block text-gray-700 hover:text-blue-600 cursor-pointer">
                Upload Profile Picture
            </a>
        </li>
        <li>
            <button class="w-full text-left text-red-600 cursor-pointer hover:text-red-700">
                Logout
            </button>
        </li>
    </ul>
</aside>

<!-- Page Content Spacer -->
<div class="pt-16"></div>
