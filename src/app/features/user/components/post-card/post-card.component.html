<div class="max-w-3xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between p-4">
        <div class="flex items-center gap-3">
            @if (postData.user.photo) {
            <img [src]="postData.user.photo" class="w-12 h-12 rounded-full object-cover" />
            }

            <div>
                <h4 class="text-sm font-semibold text-slate-800">
                    {{ postData.user.name }}
                </h4>
                <p class="text-xs text-slate-500">
                    {{ postData.createdAt | date:'short' }}
                </p>
            </div>
        </div>

        <!-- edit or delete for user posts -->
        @if (postData.user._id === userInfo._id) {
        <div class="relative">
            <button (click)="toggleMenu()" class="text-slate-500 hover:text-black">
                <i class="fa-solid fa-ellipsis cursor-pointer"></i>
            </button>

            @if (menuOpen()) {
            <div class="absolute right-0 mt-2 w-32 bg-white border rounded-lg shadow-lg">
                <button class="block w-full px-4 py-2 text-left rounded-lg hover:bg-slate-100 text-sm">
                    Edit
                </button>
                <button class="block w-full px-4 py-2 text-left rounded-lg hover:bg-red-100 text-red-600 text-sm"
                    (click)="deletePost.emit()">
                    Delete
                </button>
            </div>
            }
        </div>
        }
    </div>

    <!-- Content -->
    <div class="px-4 pb-3 text-sm text-slate-700">
        {{ postData.body }}
    </div>

    <!-- Image -->
    @if (postData.image) {
    <img [src]="postData.image" class="w-full h-64 object-cover cursor-pointer" (click)="toggleImage()" />
    }

    <!-- Comments count -->
    <p class="text-gray-500 text-sm my-2 p-2 cursor-pointer w-fit hover:text-red-500" (click)="openLayer.emit()">
        {{ commentsCount }} comments
    </p>

    <!-- Actions -->
    <div class="flex justify-between px-4 py-3 border-t text-sm text-slate-600">
        <button class="flex items-center gap-1 hover:text-red-500">
            <i class="fa-regular fa-heart"></i> Like
        </button>

        <button class="flex items-center gap-1 hover:text-red-500 cursor-pointer" (click)="openLayer.emit()">
            <i class="fa-regular fa-comment"></i> Comment
        </button>

        <button class="flex items-center gap-1 hover:text-red-500">
            <i class="fa-solid fa-share"></i> Share
        </button>
    </div>
</div>

<!-- Image Overlay -->
@if (imageOpened()) {
<div class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center" (click)="toggleImage()">

    <!-- Close Button -->
    <button class="absolute top-5 right-5 text-white text-2xl" (click)="toggleImage(); $event.stopPropagation()">
        <i class="fa-solid fa-xmark cursor-pointer hover:text-red-500"></i>
    </button>

    <!-- Image -->
    <img [src]="postData.image" class="max-w-[90%] max-h-[90%] object-contain rounded-lg"
        (click)="$event.stopPropagation()" />
</div>
}
