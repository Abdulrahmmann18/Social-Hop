<app-post-card [postData]="postData" [userInfo]="userInfo()" [commentsCount]="postCommentsNumber()"
    (openLayer)="openPostLayer()" (deletePost)="deletePost()">
</app-post-card>


@if (commentsisClicked()) {
<app-post-layer [postData]="postData" [postComments]="postComments" (close)="closePostLayer()"
    (commentAdded)="getPostComments(postData._id)">
</app-post-layer>
}
