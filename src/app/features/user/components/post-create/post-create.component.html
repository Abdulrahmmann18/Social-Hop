<!-- Create Post Card -->
<div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm p-4
         border border-gray-200 cursor-pointer
         hover:shadow-md transition">

    <!-- Top Row -->
    <div class="flex items-center gap-3 mb-3">
        <!-- Avatar -->
        <div class="w-10 h-10 rounded-full bg-gray-300">
            <img [src]="userInfo().photo" alt="Profile" class="w-10 h-10 rounded-full border-2 border-blue-500" />
        </div>

        <!-- Fake Input -->
        <div (click)="openModal()" class="flex-1 px-4 py-2 rounded-full bg-gray-100
             text-gray-500 hover:bg-gray-200 transition">
            What's on your mind?
        </div>
    </div>
</div>

<!-- Modal Overlay -->
@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">

    <!-- Modal Card -->
    <div class="bg-white w-full max-w-lg rounded-xl shadow-lg p-6 relative">

        <!-- Close -->
        <button (click)="closeModal()"
            class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl cursor-pointer">
            ✕
        </button>

        <!-- Header -->
        <h2 class="text-xl font-semibold text-gray-800 mb-4">
            Create Post
        </h2>

        <!-- User Info -->
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 bg-gray-300 rounded-full">
                <img [src]="userInfo().photo" alt="Profile" class="w-10 h-10 rounded-full border-2 border-blue-500" />
            </div>
            <div>
                <p class="font-medium text-gray-700">{{userInfo().name}}</p>
                <p class="text-xs text-gray-500">Public</p>
            </div>
        </div>

        <!-- Textarea -->
        <textarea [(ngModel)]="postContent" placeholder="What's on your mind?" class="w-full h-32 resize-none rounded-lg border border-gray-300 p-3
                 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
        </textarea>

        <div class="flex items-center justify-center w-full rounded-lg border border-gray-300 mb-4">
            <label for="dropzone-file"
                class="flex flex-col items-center justify-center w-full h-64 bg-neutral-secondary-medium border border-dashed border-default-strong rounded-base cursor-pointer hover:bg-neutral-tertiary-medium">
                <div class="flex flex-col items-center justify-center text-body pt-5 pb-6">
                    <svg class="w-8 h-8 mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h3a3 3 0 0 0 0-6h-.025a5.56 5.56 0 0 0 .025-.5A5.5 5.5 0 0 0 7.207 9.021C7.137 9.017 7.071 9 7 9a4 4 0 1 0 0 8h2.167M12 19v-9m0 0-2 2m2-2 2 2" />
                    </svg>
                    <p class="mb-2 text-sm"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    <p class="text-xs">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
                </div>
                <input (change)="captureImage($event)" id="dropzone-file" type="file" class="hidden" />
            </label>
        </div>


        <!-- Buttons -->
        <div class="flex justify-center gap-3">
            <button (click)="closeModal()"
                class="px-4 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 cursor-pointer">
                Cancel
            </button>

            <button (click)="craetePost()" class="px-4 py-2 rounded-lg font-semibold text-white bg-gradient-to-r from-purple-500 to-indigo-500
            hover:from-purple-600 hover:to-indigo-600
            focus:outline-none focus:ring-2 focus:ring-purple-300  cursor-pointer">
                Post
            </button>
        </div>

    </div>
</div>
}
