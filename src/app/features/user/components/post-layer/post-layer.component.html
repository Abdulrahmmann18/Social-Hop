<div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center" (click)="close.emit()">

    <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-xl shadow-2xl
              overflow-y-auto" (click)="$event.stopPropagation()">

        <!-- Close -->
        <div class="flex justify-end p-3 border-b">
            <button class="text-xl text-slate-600" (click)="close.emit()">
                <i class="fa-solid fa-xmark cursor-pointer hover:text-red-500"></i>
            </button>
        </div>

        <!-- Post -->
        <div class="px-4">
            <div class="flex items-center gap-3 py-3">
                <img [src]="postData.user.photo" class="w-12 h-12 rounded-full object-cover" />
                <div>
                    <h4 class="text-sm font-semibold">
                        {{ postData.user.name }}
                    </h4>
                    <p class="text-xs text-slate-500">
                        {{ postData.createdAt | date:'short' }}
                    </p>
                </div>
            </div>

            <p class="text-sm text-slate-700 pb-3">
                {{ postData.body }}
            </p>

            @if (postData.image) {
            <img [src]="postData.image" class="w-full max-h-[500px] object-cover rounded-lg" />
            }
        </div>

        <!-- Comments -->
        <app-all-comments [allComments]="postComments">
        </app-all-comments>

        <!-- Create Comment -->
        <app-comment-create [postData]="postData" (postIsCreated)="commentAdded.emit()">
        </app-comment-create>

    </div>
</div>
